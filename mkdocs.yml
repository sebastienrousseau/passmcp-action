site_name: passmcp-action
site_description: Run passmcp in GitHub Actions and GitLab CI, from the release image pinned by digest.
site_url: https://sebastienrousseau.com/passmcp-action/
repo_url: https://github.com/sebastienrousseau/passmcp-action
repo_name: sebastienrousseau/passmcp-action
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: public
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - Decision records:
      - Index: adr/README.md
      - 0001 The image by digest and nothing else: adr/0001-the-image-by-digest-and-nothing-else.md
      - 0002 The token through the environment: adr/0002-the-token-through-the-environment.md
      - 0003 The version is passmcp's: adr/0003-the-version-is-passmcps.md
      - 0004 Coverage traces the scripts: adr/0004-coverage-traces-the-scripts-not-bats.md
  - Releases:
      - 0.0.2: releases/v0.0.2.md
      - 0.0.1: releases/v0.0.1.md
