#
# passmcp in GitLab CI, from the published image pinned by digest.
#
#   include:
#     - remote: https://raw.githubusercontent.com/sebastienrousseau/passmcp-action/v0.0.3/templates/passmcp.gitlab-ci.yml
#
# then set MCP_ENDPOINT, and MCP_TOKEN as a masked, protected variable. passmcp
# reads the token from the environment; it is never an argument.

variables:
  PASSMCP_IMAGE: "ghcr.io/sebastienrousseau/passmcp@sha256:88668e403cb4fe2e63032e9d69550acb59a449701d1f2ab1b52d436e96806dad"
  PASSMCP_ARGS: "--rps 2"

mcp-diagnostic:
  image:
    name: "${PASSMCP_IMAGE}"
    entrypoint: [""]
  timeout: 15m
  script:
    - >
      /usr/local/bin/passmcp check "${MCP_ENDPOINT}" --token-env MCP_TOKEN
      --report-dir passmcp-report --no-color ${PASSMCP_ARGS}
  artifacts:
    when: always
    paths:
      - passmcp-report/
    reports:
      sast: passmcp-report/report.sarif
    expire_in: 30 days
  allow_failure:
    # 2 is "a check failed or the policy was not met": the report is the
    # point, so it is recorded as a failed job rather than a broken one.
    exit_codes: []
