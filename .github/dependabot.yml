version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
    # The passmcp image in action.yml is pinned by digest on purpose and is
    # moved by the sync workflow when passmcp releases, never by Dependabot:
    # the action must run the image of the version it is in lockstep with.

  # bashcov and SimpleCov for `make coverage`, locked with checksums.
  - package-ecosystem: "bundler"
    directory: "/tests"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
