name: Manual

# Builds the manual on every change to it, strictly, so a broken link or
# nav entry fails the pull request rather than the reader; and deploys it
# to GitHub Pages from main, with coverage.json beside it: the shields.io
# endpoint the README's coverage badge reads, from the same `make coverage`
# CI runs. A change to the scripts or the tests redeploys it.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/**'
      - 'tests/**'
      - '.simplecov'
      - 'Makefile'
      - '.github/workflows/manual.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/**'
      - 'tests/**'
      - '.simplecov'
      - 'Makefile'
      - '.github/workflows/manual.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build manual
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/tests/Gemfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # --require-hashes: the lock is passmcp's, byte for byte, so the family's
      # manuals build from the same reviewed artefacts.
      - name: Build with MkDocs
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            --require-hashes -r docs/requirements.txt
          mkdocs build --strict --site-dir public

      - name: Install bats
        run: sudo apt-get install -y --no-install-recommends bats

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: tests

      - name: Coverage badge endpoint
        run: |
          set -euo pipefail
          make coverage BASHCOV="bundle exec bashcov"
          cp coverage/badge.json public/coverage.json

      - name: Upload the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
