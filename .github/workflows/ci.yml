name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A run on demand, for when the push that should have run it did not.
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint and shellcheck
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          shellcheck scripts/*.sh tests/traced.sh tests/bin/curl tests/bin/gh tests/helpers.bash tests/*.bats
      - name: Every source file carries an SPDX header
        run: scripts/spdx-check.sh
      - name: The retired name appears nowhere
        run: ./scripts/name-guard.sh
      - name: Every version-bearing place names one version
        run: make versions

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/tests/Gemfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats
        run: sudo apt-get install -y --no-install-recommends bats
      # bashcov and SimpleCov, from tests/Gemfile.lock with its checksums.
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: tests
      - name: The suite under bashcov, at or above 85%
        run: make coverage BASHCOV="bundle exec bashcov"
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  smoke:
    name: The pinned image runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action against itself, without a server: proves the digest
      # pulls, the entrypoint answers, and the composite steps parse.
      - name: passmcp version through the action
        id: version
        uses: ./
        with:
          command: version
          upload: "false"
      # And a check that must refuse cleanly: no endpoint is an error
      # from the action, not a hang or a docker error.
      - name: A check with no endpoint is refused
        id: refused
        continue-on-error: true
        uses: ./
        with:
          upload: "false"
      - name: It was refused
        env:
          OUTCOME: ${{ steps.refused.outcome }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ] || { echo "::error::a check with no endpoint should fail, got ${OUTCOME}"; exit 1; }

  checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pinned digest is the image of this version
        run: make digest
      - name: This repository's row in the family manifest is true
        run: make family
      - name: Version Lockstep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make lockstep
